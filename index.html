<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>For Zahin ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- 🎵 Background Music -->
    <audio id="bgMusic" loop preload="auto">
      <source src="./love.mp3" type="audio/mpeg" />
    </audio>

    <!-- ❤️ Floating hearts -->
    <div class="hearts"></div>

    <!-- 💌 Main Card -->
    <div class="card">
      <h1 id="text"></h1>
      <div id="options"></div>

      <!-- Secret Love Note Icon (centered) -->
      <div id="secretIcon">💌</div>
    </div>

    <!-- 💕 Secret Message Modal -->
    <div id="secretModal">
      <div class="secretCard">
        <p>
          Zahin 💕<br /><br />
          You are the best thing that ever happened to me ❤️<br /><br />
          Our story was already written in the stars 💫✨
          I love you sooo muchh ❤️❤️<br /><br />
          I want to spend the rest of my life with YOU !!!
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
